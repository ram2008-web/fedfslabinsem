<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>
    <h1>Student Registration</h1>

    <form>
        <label for="student-id">Student ID:</label>
        <input id="student-id" name="studentId" type="text" required><br><br>

        <label for="student-name">Name:</label>
        <input id="student-name" name="studentName" type="text" required><br><br>

        <label for="department">Department:</label>
        <select id="department" name="department" required>
            <option value="">Select Department</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>IT</option>
        </select><br><br>

        <label for="phone">Phone:</label>
        <input id="phone" name="phone" type="tel" required><br><br>

        <label for="email">Email:</label>
        <input id="email" name="email" type="email" required><br><br>

        <button type="submit">Register Student</button>
        <button type="reset">Clear</button>
    </form>

    <br>
    <a href="index.html">Home</a> |

</body>
</html>
